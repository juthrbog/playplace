---
version: 2
project_name: playplace

before:
  hooks:
    - bash scripts/completions.sh

builds:
  - id: playplace
    main: ./cmd/playplace
    binary: playplace
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X playplace/internal/cli.version={{ .Version }}

archives:
  - id: playplace
    ids: [playplace]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Ship only the docs for people who run playplace. Contributor docs stay
    # in the repository. Keep the PKGBUILD template in step with this list.
    files:
      - LICENSE
      - README.md
      - docs/index.md
      - docs/requesting.md
      - docs/approving.md
      - docs/cli.md
      - docs/configuration.md
      - docs/budgets.md
      - docs/deploy.md
      - docs/assets/banner.png
      - deploy/README.md
      - deploy/aws/*.json
      - src: .generated/completions/*
        dst: completions
        strip_parent: true

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

release:
  github:
    owner: juthrbog
    name: playplace
  # Attach and verify package recipes before making the release public.
  draft: true
  prerelease: auto

changelog:
  use: git
