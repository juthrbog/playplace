---
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # Serialize releases so two tags cannot race to update the same formula.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          pattern+='(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH with optional prerelease suffix.'
            exit 1
          fi

      - name: Test and vet the tagged source
        run: |
          test -z "$(gofmt -l cmd internal tools deploy/aws)"
          bash scripts/check-generated.sh
          go test -race ./...
          go vet ./...

      - name: Build archives and create draft release
        # goreleaser-action v7
        uses: >-
          goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and validate package recipes
        run: |
          go run ./tools/package-release -dist dist
          bash scripts/check-release.sh

      - name: Attach recipes and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            dist/packages/playplace.rb dist/packages/PKGBUILD \
            dist/packages/SRCINFO dist/packages/packaging_checksums.txt
          # Verify uploaded filenames and bytes before publishing.
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$RELEASE_TAG" --dir "$verify_dir" \
            --pattern playplace.rb --pattern PKGBUILD --pattern SRCINFO \
            --pattern packaging_checksums.txt
          (cd "$verify_dir" && sha256sum -c packaging_checksums.txt)
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Check Homebrew publication setup
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Prerelease: leaving the stable Homebrew formula unchanged.'
          elif [[ -z "$TAP_SSH_KEY" && -z "$TAP_TOKEN" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Homebrew publication skipped.' \
              'Configure HOMEBREW_TAP_SSH_KEY or HOMEBREW_TAP_TOKEN' \
              '(see docs/releasing.md).'
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Homebrew tap
        if: steps.tap.outputs.enabled == 'true'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: juthrbog/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}
          path: .homebrew-tap

      - name: Update Homebrew formula
        if: steps.tap.outputs.enabled == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p .homebrew-tap/Formula
          cp dist/packages/playplace.rb .homebrew-tap/Formula/playplace.rb
          git -C .homebrew-tap config user.name 'github-actions[bot]'
          git -C .homebrew-tap config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .homebrew-tap add Formula/playplace.rb
          if ! git -C .homebrew-tap diff --cached --quiet; then
            git -C .homebrew-tap commit -m "Update playplace to $RELEASE_TAG"
            git -C .homebrew-tap push
          fi
